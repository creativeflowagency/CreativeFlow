<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CreativeFlow | Video Editing Agency and Creator App</title>
<meta name="description" content="CreativeFlow: a YouTube video editing agency, and the CreativeFlow App for content creators. Pick where you want to go.">
<link rel="canonical" href="https://creativeflow.media/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="CreativeFlow">
<meta property="og:title" content="CreativeFlow">
<meta property="og:description" content="A YouTube video editing agency, and the app that makes creators' lives easier.">
<meta property="og:url" content="https://creativeflow.media/">
<meta property="og:image" content="https://creativeflow.media/favicon.png">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#0a0712">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<script>
  // Old links like creativeflow.media/#contact go to the same place on the agency site.
  (function () {
    var h = location.hash.replace('#', '');
    if (h === 'app') location.replace('/app/');
    else if (h && h !== 'home') location.replace('/agency/' + location.hash);
  })();
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "CreativeFlow",
  "url": "https://creativeflow.media",
  "sameAs": [
    "https://www.instagram.com/creativefloworg/",
    "https://www.youtube.com/@rich_malone_16"
  ]
}
</script>
<style>
  :root{
    --ink: #0e0f13;
    --text: #f3f2ee;
    --text-dim: #b4b3bb;
    --accent: #5c2fe0;
    --font: "Plus Jakarta Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{ box-sizing: border-box; }
  html, body{ margin: 0; background: var(--ink); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; overflow-x: clip; }
  body{ min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: 1fr auto; }
  .sky{
    position: fixed; inset: -12%; z-index: 0; pointer-events: none;
    background:
      radial-gradient(42% 32% at 50% 22%, rgba(92,47,224,0.42), transparent 68%),
      radial-gradient(28% 36% at 82% 78%, rgba(91,123,255,0.16), transparent 70%),
      radial-gradient(26% 30% at 14% 72%, rgba(92,47,224,0.18), transparent 70%);
    animation: drift 16s ease-in-out infinite alternate;
  }
  body::after{
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 40%, transparent 40%, rgba(0,0,0,0.45) 100%);
  }
  @keyframes drift{
    from{ transform: translate3d(0, 0, 0) scale(1); }
    to{ transform: translate3d(0, -2.5%, 0) scale(1.06); }
  }
  main{
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(28px + env(safe-area-inset-top)) 18px 20px;
    text-align: center;
  }
  .logo{
    width: 112px; height: 112px;
    filter: drop-shadow(0 16px 28px rgba(0,0,0,0.45));
  }
  h1{
    margin: 14px 0 0;
    font-size: clamp(44px, 8vw, 76px);
    font-weight: 800;
    letter-spacing: -0.045em;
    line-height: 1;
  }
  .sub{
    margin: 12px 0 0;
    color: var(--text-dim);
    font-weight: 500;
    font-size: clamp(15px, 2vw, 18px);
  }
  .menu{
    position: relative;
    width: min(640px, 100%);
    margin-top: 34px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .menu-cursor{
    position: absolute;
    left: 14px;
    top: 0;
    z-index: 3;
    width: 18px;
    height: 18px;
    color: #fff;
    opacity: 0;
    pointer-events: none;
    filter: drop-shadow(0 0 8px rgba(186,170,255,0.95));
    transition: transform 0.22s cubic-bezier(.2,.75,.2,1), opacity 0.16s ease;
  }
  .menu-cursor svg{ width: 18px; height: 18px; display: block; }
  .menu-cursor.is-on{ opacity: 1; }
  .menu-btn{
    position: relative;
    overflow: hidden;
    isolation: isolate;
    display: grid;
    grid-template-columns: 48px 1fr;
    align-items: center;
    gap: 14px;
    min-height: 88px;
    padding: 14px 20px 14px 46px;
    border-radius: 14px;
    text-decoration: none;
    text-align: left;
    color: var(--text);
    background:
      linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0) 46%),
      linear-gradient(180deg, #3c3d4c 0%, #242530 58%, #171820 100%);
    border: 1px solid rgba(255,255,255,0.16);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.32),
      inset 0 -3px 0 rgba(0,0,0,0.35),
      0 7px 0 #090a0e,
      0 16px 28px rgba(0,0,0,0.38);
    transform: translateY(0);
    transition: transform 0.16s cubic-bezier(.2,.7,.2,1), background 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
  }
  .menu-btn::before{
    content: "";
    position: absolute;
    inset: 1px 1px auto 1px;
    height: 46%;
    border-radius: 12px 12px 40% 40%;
    background: linear-gradient(180deg, rgba(255,255,255,0.16), transparent);
    pointer-events: none;
  }
  .menu-btn::after{
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg, transparent 32%, rgba(255,255,255,0.28) 48%, transparent 64%);
    transform: translateX(-130%);
    pointer-events: none;
  }
  .menu-btn.is-on{
    color: #fff;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0) 42%),
      linear-gradient(100deg, #7a5cff 0%, #5c2fe0 46%, #3d19b8 100%);
    border-color: rgba(226,218,255,0.85);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.5),
      inset 0 -3px 0 rgba(30,10,80,0.35),
      0 8px 0 #24125f,
      0 18px 34px rgba(92,47,224,0.48);
    transform: translateY(-4px) scale(1.015);
    outline: none;
  }
  .menu-btn.is-on::after{ animation: menu-sweep 0.7s ease; }
  .menu-btn:active,
  .menu-btn.is-down{
    transform: translateY(5px) scale(0.992);
    box-shadow:
      inset 0 3px 6px rgba(0,0,0,0.38),
      inset 0 1px 0 rgba(255,255,255,0.14),
      0 1px 0 #090a0e;
    transition-duration: 0.05s;
  }
  @keyframes menu-sweep{ to{ transform: translateX(130%); } }
  .menu-ico{
    width: 48px; height: 48px;
    border-radius: 12px;
    display: grid; place-items: center;
    background: rgba(0,0,0,0.28);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 1px 0 rgba(0,0,0,0.25);
    color: #fff;
  }
  .menu-ico svg{ width: 24px; height: 24px; }
  .menu-copy{ min-width: 0; }
  .menu-label{
    display: block;
    font-size: clamp(22px, 4.4vw, 28px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.05;
  }
  .menu-note{
    display: block;
    margin-top: 4px;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.3;
    color: rgba(243,242,238,0.7);
  }
  .menu-btn.is-on .menu-note{ color: rgba(255,255,255,0.9); }
  footer{
    position: relative; z-index: 1;
    text-align: center;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    color: #8e8d96;
    font-size: 13px;
    font-weight: 500;
  }
  footer a{ color: #d8d7de; text-decoration: none; }
  footer a:hover{ color: #fff; }
  footer a:focus-visible{ outline: 2px solid #c9c0ff; outline-offset: 3px; }
  @media (min-width: 800px){
    .logo{ width: 148px; height: 148px; }
    .menu{ margin-top: 40px; gap: 18px; }
    .menu-btn{ min-height: 96px; padding-right: 28px; }
  }
  @media (prefers-reduced-motion: reduce){
    .sky, .menu-btn, .menu-cursor, .menu-btn::after{ animation: none !important; transition: none !important; }
    .menu-btn.is-on, .menu-btn:active, .menu-btn.is-down{ transform: none; }
  }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<main>
  <img class="logo" src="/favicon.png" alt="" width="148" height="148">
  <h1>CreativeFlow</h1>
  <p class="sub">Where do you want to go?</p>
  <nav class="menu" aria-label="Choose a site">
    <span class="menu-cursor" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 4.5 18.5 12 8 19.5V4.5z"/></svg></span>
    <a class="menu-btn" href="/agency/">
      <span class="menu-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="2"/><path d="M15.5 10.2 21 7.2v9.6l-5.5-3"/></svg></span>
      <span class="menu-copy">
        <span class="menu-label">Agency</span>
        <span class="menu-note">Editing and content for creators</span>
      </span>
    </a>
    <a class="menu-btn" href="/app/">
      <span class="menu-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.2 20.5 7.5 12 11.8 3.5 7.5 12 3.2z"/><path d="M3.5 12 12 16.3 20.5 12"/><path d="M3.5 16.2 12 20.5l8.5-4.3"/></svg></span>
      <span class="menu-copy">
        <span class="menu-label">App</span>
        <span class="menu-note">The CreativeFlow app</span>
      </span>
    </a>
  </nav>
</main>
<footer>&copy; 2026 CreativeFlow · <a href="/agency/#terms">Terms</a> · <a href="/agency/#privacy">Privacy</a></footer>
<script>
  (function () {
    var menu = document.querySelector(".menu");
    var buttons = Array.prototype.slice.call(document.querySelectorAll(".menu-btn"));
    var cursor = document.querySelector(".menu-cursor");
    function select(btn){
      buttons.forEach(function (item) { item.classList.toggle("is-on", item === btn); });
      if (!cursor || !btn) return;
      var menuBox = menu.getBoundingClientRect();
      var box = btn.getBoundingClientRect();
      var top = box.top - menuBox.top + (box.height - cursor.offsetHeight) / 2;
      cursor.style.transform = "translateY(" + top + "px)";
      cursor.classList.add("is-on");
    }
    function clearIfIdle(){
      if (menu.contains(document.activeElement)) return;
      buttons.forEach(function (item) { item.classList.remove("is-on"); });
      if (cursor) cursor.classList.remove("is-on");
    }
    buttons.forEach(function (btn) {
      btn.addEventListener("mouseenter", function () { select(btn); });
      btn.addEventListener("focus", function () { select(btn); });
      btn.addEventListener("pointerdown", function () { btn.classList.add("is-down"); });
      btn.addEventListener("pointerup", function () { btn.classList.remove("is-down"); });
      btn.addEventListener("pointercancel", function () { btn.classList.remove("is-down"); });
    });
    menu.addEventListener("mouseleave", clearIfIdle);
    document.addEventListener("focusin", clearIfIdle);
    window.addEventListener("resize", function () {
      var on = menu.querySelector(".menu-btn.is-on");
      if (on) select(on);
    });
    document.addEventListener("keydown", function (e) {
      if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      var index = buttons.indexOf(document.activeElement);
      var next;
      if (index === -1) next = e.key === "ArrowUp" ? buttons.length - 1 : 0;
      else next = e.key === "ArrowDown" ? (index + 1) % buttons.length : (index - 1 + buttons.length) % buttons.length;
      buttons[next].focus();
      e.preventDefault();
    });
  })();
</script>
</body>
</html>
