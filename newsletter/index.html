<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CreativeFlow Newsletter | Editing and Creator Tips by Rich Malone</title>
<meta name="description" content="Join the CreativeFlow newsletter: editing tips, creator strategy and CreativeFlow news from Rich Malone, straight to your inbox.">
<link rel="canonical" href="https://creativeflow.media/newsletter/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="CreativeFlow">
<meta property="og:title" content="The CreativeFlow Newsletter">
<meta property="og:description" content="Editing tips, creator strategy and CreativeFlow news, straight to your inbox.">
<meta property="og:url" content="https://creativeflow.media/newsletter/">
<meta property="og:image" content="https://creativeflow.media/favicon.png">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#0e0f13">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #0e0f13;
    --ink-2: #17181f;
    --text: #f3f2ee;
    --text-dim: #b4b3bb;
    --line: rgba(255,255,255,0.10);
    --line-strong: rgba(255,255,255,0.18);
    --accent: #5c2fe0;
    --accent-ink: #c9c0ff;
    --font: "Plus Jakarta Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{ box-sizing: border-box; }
  html, body{ margin: 0; background: var(--ink); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; overflow-x: clip; }
  body{ min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: 1fr auto; }
  .sky{
    position: fixed; inset: -12%; z-index: 0; pointer-events: none;
    background:
      radial-gradient(42% 32% at 50% 18%, rgba(92,47,224,0.40), transparent 68%),
      radial-gradient(28% 36% at 84% 80%, rgba(91,123,255,0.14), transparent 70%),
      radial-gradient(26% 30% at 12% 74%, rgba(92,47,224,0.16), transparent 70%);
    animation: drift 16s ease-in-out infinite alternate;
  }
  body::after{
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 40%, transparent 40%, rgba(0,0,0,0.45) 100%);
  }
  @keyframes drift{
    from{ transform: translate3d(0, 0, 0) scale(1); }
    to{ transform: translate3d(0, -2.5%, 0) scale(1.06); }
  }
  main{
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(40px + env(safe-area-inset-top)) 18px 32px;
    text-align: center;
  }
  .logo{ width: 84px; height: 84px; filter: drop-shadow(0 16px 28px rgba(0,0,0,0.45)); }
  .kicker{ margin: 18px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent-ink); }
  h1{
    margin: 12px 0 0;
    font-size: clamp(36px, 7vw, 60px);
    font-weight: 800;
    letter-spacing: -0.045em;
    line-height: 1.02;
    max-width: 14ch;
    text-wrap: balance;
  }
  .sub{ margin: 14px auto 0; max-width: 40ch; color: var(--text-dim); font-weight: 500; font-size: clamp(15px, 2vw, 18px); line-height: 1.55; }
  .card{
    width: min(420px, 100%);
    margin-top: 32px;
    padding: 26px 22px 22px;
    background: rgba(23,24,31,0.86);
    border: 1px solid var(--line-strong);
    border-radius: 16px;
    text-align: left;
    box-shadow: 0 30px 70px -36px rgba(0,0,0,0.85);
  }
  form{ display: grid; gap: 14px; }
  label{ display: grid; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--text-dim); }
  input{
    width: 100%; min-height: 48px; padding: 0 14px;
    font: inherit; font-size: 16px; font-weight: 500; color: var(--text);
    background: var(--ink); border: 1px solid var(--line-strong); border-radius: 8px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input::placeholder{ color: #6d6c76; }
  input:focus{ outline: none; border-color: var(--accent-ink); box-shadow: 0 0 0 3px rgba(92,47,224,0.35); }
  .hp{ position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .btn{
    font-family: var(--font); font-weight: 600; font-size: 15px; letter-spacing: -0.01em;
    padding: 14px 20px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; line-height: 1.2;
    width: 100%; background: var(--accent); color: #fff; transition: background 0.15s ease;
  }
  .btn:hover{ background: #4c22c9; }
  .btn[disabled]{ opacity: 0.7; cursor: default; }
  .btn:focus-visible{ outline: 2px solid var(--accent-ink); outline-offset: 3px; }
  .msg{ min-height: 1.4em; margin: 2px 0 0; font-size: 14px; font-weight: 500; color: var(--text-dim); text-align: center; }
  .msg.ok{ color: #8ee6b4; } .msg.err{ color: #ff9a9a; }
  .fine{ margin: 14px 0 0; font-size: 12.5px; color: #8e8d96; text-align: center; line-height: 1.5; }
  .fine a{ color: #d8d7de; }
  .done{ text-align: center; padding: 8px 4px; }
  .done .tick{ width: 52px; height: 52px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center; background: rgba(92,47,224,0.22); color: var(--accent-ink); }
  .done .tick svg{ width: 24px; height: 24px; }
  .done h2{ margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.03em; }
  .done p{ margin: 8px 0 0; color: var(--text-dim); font-size: 15px; line-height: 1.5; }
  footer{
    position: relative; z-index: 1; text-align: center;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    color: #8e8d96; font-size: 13px; font-weight: 500;
  }
  footer a{ color: #d8d7de; text-decoration: none; }
  footer a:hover{ color: #fff; }
  @media (prefers-reduced-motion: reduce){ .sky, input, .btn{ animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<main>
  <a href="/" aria-label="CreativeFlow home"><img class="logo" src="/favicon.png" alt="" width="84" height="84"></a>
  <p class="kicker">The CreativeFlow Newsletter</p>
  <h1>Make better videos, one email at a time.</h1>
  <p class="sub">Editing tips, creator strategy and CreativeFlow news from Rich Malone, straight to your inbox.</p>

  <div class="card" id="card">
    <form id="signup" novalidate>
      <label>Your name<input name="name" autocomplete="given-name" maxlength="100" placeholder="Rich" required></label>
      <label>Email<input name="email" type="email" autocomplete="email" maxlength="200" placeholder="you@example.com" required></label>
      <div class="hp" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
      <button class="btn" type="submit">Join the newsletter</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
    <p class="fine">No spam. Unsubscribe any time with one click. See the <a href="/agency/#privacy">privacy policy</a>.</p>
  </div>
</main>
<footer>&copy; 2026 CreativeFlow · <a href="/agency/">Agency</a> · <a href="/app/">App</a> · <a href="/agency/#privacy">Privacy</a></footer>

<script>
  (function () {
    var API = 'https://creativeflow-ai.netlify.app/api/subscribe';
    var card = document.getElementById('card');
    var form = document.getElementById('signup');
    var msg = document.getElementById('msg');
    function say(text, kind) { msg.textContent = text; msg.className = 'msg' + (kind ? ' ' + kind : ''); }
    function done(title, text) {
      card.innerHTML = '<div class="done"><div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></div><h2></h2><p></p></div>';
      card.querySelector('h2').textContent = title;
      card.querySelector('p').textContent = text;
    }
    function post(body) {
      return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        .then(function (res) { return res.json().catch(function () { return {}; }).then(function (data) { return { ok: res.ok, status: res.status, data: data }; }); });
    }

    // From the unsubscribe link in a newsletter email: ?unsubscribe=<id>.<token>
    var link = new URLSearchParams(location.search).get('unsubscribe');
    if (link) {
      var parts = link.split('.');
      card.innerHTML = '<p class="msg">Unsubscribing…</p>';
      post({ action: 'unsubscribe', id: parts[0], token: parts[1] || '' }).then(function (r) {
        if (r.ok) done("You're unsubscribed", "You won't get any more newsletter emails. Changed your mind? Just sign up again on this page.");
        else done("That link didn't work", 'Reply to any newsletter email with "unsubscribe" and you\'ll be removed by hand.');
      }).catch(function () { done("Couldn't reach the server", 'Check your connection and open the link again.'); });
      try { history.replaceState(null, '', location.pathname); } catch (e) {}
      return;
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var name = form.name.value.trim(), email = form.email.value.trim();
      if (!name) { say('Add your name.', 'err'); form.name.focus(); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { say("That email doesn't look right.", 'err'); form.email.focus(); return; }
      var btn = form.querySelector('button'); btn.disabled = true; say('Joining…');
      post({ name: name, email: email, website: form.website.value }).then(function (r) {
        if (r.ok) { done("You're in, " + name + '!', "Thanks for joining. The next newsletter lands in " + email + '.'); return; }
        var code = r.data && r.data.error && r.data.error.code;
        say(code === 'bad_email' ? "That email doesn't look right." : code === 'daily_limit' ? "You've tried a few times today. Try again tomorrow." : "Couldn't sign you up. Try again in a minute.", 'err');
        btn.disabled = false;
      }).catch(function () { say("Couldn't reach the server. Check your connection and try again.", 'err'); btn.disabled = false; });
    });
  })();
</script>
</body>
</html>
